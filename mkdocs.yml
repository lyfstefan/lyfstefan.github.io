site_name: Yifan Liu
site_url: https://lyfstefan.github.io/

theme:
  name: material
  logo: images/logo.jpg
  favicon: images/logo2.png
  palette:
    primary: white
  features:
    - navigation.sections
    - navigation.expand
    - navigation.instant

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Contact: contact.md
  - Research: research.md
  - Publications: publications.md
  - Notes: notes.md
  - Teaching: teaching.md
  # - CV: cv.md

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg


extra_javascript:
  - javascripts/slider.js